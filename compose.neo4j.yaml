name: ai-novel-neo4j

services:
  neo4j:
    image: neo4j:5.26.32-community@sha256:f1e52d4dc6da122468c4a3c1050a4f5e117f6d3268625237c34d49166f0d6082
    restart: unless-stopped
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .ai-novel/neo4j/connection.env}"
      APP_NEO4J_USER: "${NEO4J_USER:-neo4j}"
      NEO4J_dbms_security_auth__minimum__password__length: "6"
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 512m
      NEO4J_server_default__advertised__address: localhost
      NEO4J_server_bolt_advertised__address: localhost:7687
      NEO4J_server_http_advertised__address: localhost:7474
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
      - neo4j-plugins:/plugins
    healthcheck:
      test:
        - CMD-SHELL
        - 'NEO4J_USERNAME="$${APP_NEO4J_USER}" NEO4J_PASSWORD="$${NEO4J_AUTH#neo4j/}" cypher-shell -a bolt://localhost:7687 -d neo4j "RETURN 1;" >/dev/null 2>&1'
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 60s
    stop_grace_period: 60s

volumes:
  neo4j-data:
    name: ai-novel-neo4j-data
  neo4j-logs:
    name: ai-novel-neo4j-logs
  neo4j-plugins:
    name: ai-novel-neo4j-plugins
